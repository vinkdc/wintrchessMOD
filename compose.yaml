name: wintrchess

services:
  app:
    build:
      context: .
      args:
        NODE_ENV: ${NODE_ENV:-production}
        ADS_PUBLISHER_ID: ${ADS_PUBLISHER_ID:-}
        ANALYTICS_MEASUREMENT_ID: ${ANALYTICS_MEASUREMENT_ID:-}
        EMAIL_ACCOUNT: ${EMAIL_ACCOUNT:-}
        GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      - database
  database:
    image: mongo:latest
    volumes:
      - wintrchess-database:/data/db
    attach: false

volumes:
  wintrchess-database:
